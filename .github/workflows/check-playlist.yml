name: 🧠 AIVOS Brain Feed
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  brain-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          pip install --no-cache-dir google-api-python-client==2.115.0 yt-dlp edge-tts anthropic

      - name: 📡 Stage 1 – Playlist Detection
        env:
          YT_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.GEMINI_API_KEY }}
          YT_PLAYLIST_ID: ${{ secrets.YT_PLAYLIST_ID }}
        run: |
          if [ -f "brain/check_playlist.py" ]; then
            python brain/check_playlist.py || echo "Stage 1 completed with warnings"
          fi

      - name: 🧠 Stage 2 – Triage & Brain Brief Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.IVCA_GEMINI_API }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -f "brain/process_queue.py" ]; then
            python brain/process_queue.py || echo "Stage 2 completed with warnings"
          fi

      - name: 💾 Commit to yt-brain
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git rm -r --cached brain/__pycache__/ 2>/dev/null || true
          git add -A
          git diff --staged --quiet || git commit -m "🧠 Brain Feed $(date +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main || git rebase --abort || true
          git push || echo "No changes to push"

      - name: 📤 Push briefs to AIVOS App
        env:
          AIVOS_TOKEN: ${{ secrets.AIVOS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "public/briefs" ]; then
            git clone https://x-access-token:$AIVOS_TOKEN@github.com/IvanekLumberjack888/AIVOS.git /tmp/aivos || exit 0
            mkdir -p /tmp/aivos/public/briefs
            cp -r public/briefs/. /tmp/aivos/public/briefs/
            cd /tmp/aivos
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add public/briefs/
            git diff --staged --quiet || git commit -m "🧠 Brief Sync $(date +%Y-%m-%d) [skip ci]"
            git push || echo "AIVOS sync completed"
          fi
